[pytest]
testpaths = tests
norecursedirs = .venv venv Document frontend node_modules dist build .git

# Marqueurs personnalisés
markers =
    slow: tests Monte Carlo lents
    integration: tests réseau ou nécessitant une clé API

# Exclusion par défaut des tests d'intégration (réseau / clé API)
addopts = -m "not integration"
